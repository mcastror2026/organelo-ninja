<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organelo Invaders</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
  video{display:none}
  #msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:15px;background:rgba(0,0,0,.55);
       padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;color:#dfe9f3}
  #other{position:fixed;top:16px;right:16px;color:#7ff6ff;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:999px;
         text-decoration:none;font-size:15px;border:1px solid rgba(127,246,255,.35)}
  #other:hover{background:rgba(127,246,255,.15)}
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="c"></canvas>
<a id="other" href="index.html">⚔️ Organelo Ninja</a>
<div id="msg"></div>

<script type="module">
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const video = document.getElementById('cam'), msgEl = document.getElementById('msg'), otherEl = document.getElementById('other');
const TAU = Math.PI * 2;
let W, H;
const S = () => Math.min(W, H);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ================= Organelos (mismos dibujos que Organelo Ninja) ================= */
function ell(x, y, a, b, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, a, b, rot, 0, TAU); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function drawMito(r) {
  ctx.lineWidth = r * .08; ctx.fillStyle = '#ff8a3d'; ctx.strokeStyle = '#9c3f0c';
  ell(0, 0, r, r * .58); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd0a1'; ell(0, 0, r * .8, r * .4); ctx.fill();
  ctx.strokeStyle = '#e0661e'; ctx.lineWidth = r * .1; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r * .72, 0);
  for (let i = 0; i < 6; i++) ctx.lineTo(-r * .55 + i * r * .22, (i % 2 ? 1 : -1) * r * .26);
  ctx.lineTo(r * .72, 0); ctx.stroke();
}
function drawChloro(r) {
  ctx.lineWidth = r * .08; ctx.fillStyle = '#46c261'; ctx.strokeStyle = '#17692c';
  ell(0, 0, r, r * .62); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#8fe39f'; ctx.lineWidth = r * .05;
  ctx.beginPath(); ctx.moveTo(-r * .7, 0); ctx.lineTo(r * .7, 0); ctx.stroke();
  ctx.fillStyle = '#1f8a3b';
  for (const gx of [-.45, 0, .45]) for (let k = -1; k <= 1; k++)
    ctx.fillRect(gx * r - r * .14, k * r * .14 - r * .05, r * .28, r * .1);
}
function drawLyso(r) {
  ctx.lineWidth = r * .1; ctx.fillStyle = '#a36bff'; ctx.strokeStyle = '#5a2bb0';
  circ(0, 0, r); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e9dcff';
  for (let i = 0; i < 7; i++) {
    const a = i * 2.4, d = r * (.2 + .45 * ((i * 37) % 10) / 10);
    circ(Math.cos(a) * d, Math.sin(a) * d, r * .11); ctx.fill();
  }
}
function drawGolgi(r) {
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const y = -r * .5 + i * r * .33, w = r * (.95 - i * .1);
    for (const [c, lw] of [['#a3265e', r * .24], ['#ff79b0', r * .15]]) {
      ctx.strokeStyle = c; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(-w, y + r * .18); ctx.quadraticCurveTo(0, y - r * .2, w, y + r * .18); ctx.stroke();
    }
  }
  ctx.fillStyle = '#ff79b0'; ctx.strokeStyle = '#a3265e'; ctx.lineWidth = r * .05;
  for (const [x, y] of [[r * .95, -r * .55], [-r * .9, r * .75], [r * .8, r * .85]]) { circ(x, y, r * .1); ctx.fill(); ctx.stroke(); }
}
function drawVacuole(r) {
  ctx.fillStyle = 'rgba(110,200,255,.55)'; ctx.strokeStyle = '#8fdcff'; ctx.lineWidth = r * .07;
  circ(0, 0, r); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ell(-r * .35, -r * .35, r * .25, r * .14, -.7); ctx.fill();
}
function drawRibo(r) {
  ctx.lineWidth = r * .1; ctx.strokeStyle = '#8a5a00';
  ctx.fillStyle = '#ffd23f'; ell(0, r * .2, r * .85, r * .65); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffb020'; ell(0, -r * .5, r * .6, r * .4); ctx.fill(); ctx.stroke();
}
function drawNucleus(r, t) {
  const p = .5 + .5 * Math.sin(t * 7);
  ctx.save(); ctx.shadowColor = '#ff2e4d'; ctx.shadowBlur = 20 + 20 * p;
  ctx.fillStyle = '#4a2170'; circ(0, 0, r); ctx.fill(); ctx.restore();
  ctx.strokeStyle = '#7a4bb0'; ctx.lineWidth = r * .06; ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const a = i * 1.3;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .7, Math.sin(a) * r * .7);
    ctx.quadraticCurveTo(Math.cos(a + .8) * r * .2, Math.sin(a + .8) * r * .2, Math.cos(a + 1.5) * r * .6, Math.sin(a + 1.5) * r * .6);
    ctx.stroke();
  }
  ctx.fillStyle = '#24092f'; circ(r * .18, r * .12, r * .33); ctx.fill();
  ctx.lineWidth = r * .1; ctx.strokeStyle = `rgba(255,77,109,${.6 + .4 * p})`; circ(0, 0, r); ctx.stroke();
  ctx.fillStyle = '#ffb3c1';
  for (let i = 0; i < 10; i++) { circ(Math.cos(i * TAU / 10) * r, Math.sin(i * TAU / 10) * r, r * .06); ctx.fill(); }
}
const TYPES = {
  ribosoma:    { name: 'Ribosoma', pts: 30, col: '#ffd23f', draw: drawRibo, fact: 'sintetiza proteínas a partir del ARNm' },
  golgi:       { name: 'Aparato de Golgi', pts: 20, col: '#ff79b0', draw: drawGolgi, fact: 'modifica, empaqueta y distribuye proteínas' },
  mitocondria: { name: 'Mitocondria', pts: 15, col: '#ff8a3d', draw: drawMito, fact: 'produce ATP mediante la respiración celular' },
  cloroplasto: { name: 'Cloroplasto', pts: 15, col: '#46c261', draw: drawChloro, fact: 'realiza la fotosíntesis en células vegetales' },
  lisosoma:    { name: 'Lisosoma', pts: 10, col: '#a36bff', draw: drawLyso, fact: 'digiere material con enzimas hidrolíticas' },
  vacuola:     { name: 'Vacuola', pts: 10, col: '#8fdcff', draw: drawVacuole, fact: 'almacena agua y mantiene la turgencia' },
  nucleo:      { name: 'Núcleo', pts: 0, col: '#ff4d6d', draw: drawNucleus, fact: 'contiene el ADN y dirige la actividad celular' },
};

/* ================= Estado ================= */
const MAXL = 3;
let state = 'menu', score = 0, lives = MAXL, wave = 0, overAt = 0, newBest = false;
let enemies = [], form = {}, pBullets = [], eBullets = [], parts = [], floats = [], bunkers = [], bunkerCS = 6;
let ufo = null, ufoT = 15, eFireT = 1.5, marchT = 0, marchI = 0, invul = 0, betweenT = 0;
let waveMsg = null, fact = null, shake = 0, flash = 0, autoFire = false;
const player = { x: 0, tx: 0, y: 0, r: 0, cool: 0 };
const keys = {};
let best = 0;
try { best = +localStorage.getItem('organeloInvadersBest') || 0; } catch (e) {}

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  player.r = S() * .038; player.y = H - S() * .09;
  if (!player.x) player.x = player.tx = W / 2;
}
addEventListener('resize', resize); resize();

function buildBunkers() {
  bunkers = [];
  const cs = Math.max(5, S() * .012), cols = 11, rows = 7, y0 = player.y - S() * .2;
  for (let b = 0; b < 4; b++) {
    const cx = W * (b + 1) / 5;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      if ((j === 0 && (i < 2 || i > cols - 3)) || (j === 1 && (i === 0 || i === cols - 1))) continue;
      if (j >= rows - 3 && i >= 3 && i <= cols - 4) continue;
      bunkers.push({ x: cx + (i - (cols - 1) / 2) * cs, y: y0 + j * cs, j, alive: true });
    }
  }
  bunkerCS = cs;
}
function hitBunker(x, y, rad) {
  const h = bunkerCS * .6 + rad;
  if (!bunkers.some(c => c.alive && Math.abs(c.x - x) < h && Math.abs(c.y - y) < h)) return false;
  for (const c of bunkers) if (c.alive && Math.hypot(c.x - x, c.y - y) < bunkerCS * 1.8) c.alive = false;
  return true;
}

function nextWave() {
  wave++;
  const cols = W > 1000 ? 10 : W > 700 ? 8 : 6, rows = 5;
  const sx = Math.min(W * .8 / cols, S() * .1), sy = S() * .075;
  const rowTypes = ['ribosoma', 'golgi', 'mitocondria', 'cloroplasto', wave % 2 ? 'lisosoma' : 'vacuola'];
  form = { sx, sy, er: Math.min(sx, sy) * .38, dir: 1, ox: (W - sx * (cols - 1)) / 2,
           oy: H * .14 + Math.min(wave - 1, 5) * S() * .02 };
  enemies = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    enemies.push({ c, row: r, type: rowTypes[r], alive: true, ph: Math.random() * TAU });
  pBullets = []; eBullets = []; eFireT = 1.5;
}
const epos = e => [form.ox + e.c * form.sx, form.oy + e.row * form.sy];

function startGame() {
  state = 'playing'; score = 0; lives = MAXL; wave = 0; invul = 0; betweenT = 0;
  ufo = null; ufoT = 15; fact = null; waveMsg = null;
  nextWave(); buildBunkers();
}
function gameOver() {
  state = 'over'; overAt = performance.now();
  newBest = score > best;
  if (newBest) { best = score; try { localStorage.setItem('organeloInvadersBest', best); } catch (e) {} }
  sfx('hit');
}

function tryFire() {
  if (state !== 'playing' || player.cool > 0 || pBullets.length >= 3 || betweenT > 0) return;
  pBullets.push({ x: player.x, y: player.y - player.r * 1.6 });
  player.cool = .25; sfx('pew');
}
// entrada de disparo (pulgar, clic o espacio): también inicia la partida desde el menú
function fireInput() {
  ac();
  if (state === 'menu' || (state === 'over' && performance.now() - overAt > 1200)) { startGame(); return; }
  tryFire();
}

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = S() * (.1 + Math.random() * .4);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 2 + Math.random() * 4, col, life: .5 + Math.random() * .4 });
  }
}
function killEnemy(e, x, y) {
  const T = TYPES[e.type];
  e.alive = false; score += T.pts;
  burst(x, y, T.col, 16);
  floats.push({ x, y, text: `+${T.pts}`, col: T.col, life: .9 });
  fact = { text: `${T.name}: ${T.fact}`, life: 3 };
  sfx('boom');
}
function playerHit() {
  lives--; invul = 2; shake = 14; flash = 1; eBullets = [];
  burst(player.x, player.y, '#7ff6ff', 30); sfx('hit');
  if (lives <= 0) gameOver();
}

/* ================= Actualización ================= */
function update(dt, now) {
  if (keys.ArrowLeft) player.tx -= S() * 1.3 * dt;
  if (keys.ArrowRight) player.tx += S() * 1.3 * dt;
  player.tx = clamp(player.tx, player.r * 1.4, W - player.r * 1.4);
  player.x += (player.tx - player.x) * Math.min(1, dt * 14);
  player.cool -= dt;
  if (autoFire || keys[' ']) tryFire(); // mantener ESPACIO = ráfaga

  for (const p of parts) { p.vy += S() * .8 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 40 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  flash = Math.max(0, flash - dt * 2); shake = Math.max(0, shake - dt * 30);
  if (fact && (fact.life -= dt) <= 0) fact = null;
  if (waveMsg && (waveMsg.life -= dt) <= 0) waveMsg = null;
  if (state !== 'playing') return;

  invul = Math.max(0, invul - dt);
  if (betweenT > 0) { if ((betweenT -= dt) <= 0) nextWave(); }
  else {
    const alive = enemies.filter(e => e.alive);
    if (!alive.length) {
      betweenT = 2; waveMsg = { text: `¡Oleada ${wave} superada!`, life: 2 }; sfx('wave');
      pBullets = []; eBullets = [];
    } else {
      const frac = alive.length / enemies.length;
      form.ox += form.dir * S() * (.06 + .05 * (wave - 1)) * (1 + 3 * (1 - frac)) * dt;
      let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const e of alive) { const [x, y] = epos(e); minX = Math.min(minX, x); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); }
      if ((form.dir > 0 && maxX + form.er > W - 16) || (form.dir < 0 && minX - form.er < 16)) {
        form.dir *= -1; form.oy += form.sy * .45;
      }
      // los organelos rompen las membranas al tocarlas
      if (bunkers.length && maxY + form.er > bunkers[0].y - bunkerCS * 3)
        for (const e of alive) {
          const [x, y] = epos(e);
          for (const c of bunkers) if (c.alive && Math.abs(c.x - x) < form.er && Math.abs(c.y - y) < form.er) c.alive = false;
        }
      if (maxY + form.er > player.y - player.r) { lives = 0; gameOver(); return; }
      // disparo enemigo: el organelo más bajo de una columna al azar
      if ((eFireT -= dt) <= 0) {
        const c = pick(alive).c;
        const shooter = alive.filter(e => e.c === c).reduce((a, b) => (b.row > a.row ? b : a));
        const [x, y] = epos(shooter);
        eBullets.push({ x, y: y + form.er, vy: S() * (.35 + .03 * wave) });
        eFireT = Math.max(.35, 1.4 - wave * .12) * (.6 + .8 * Math.random());
      }
      if ((marchT -= dt) <= 0) { marchT = .12 + .65 * frac; sfx('march'); }
    }
  }

  // núcleo bonus
  if (!ufo && (ufoT -= dt) <= 0) {
    const dir = Math.random() < .5 ? 1 : -1, r = S() * .035;
    ufo = { dir, r, x: dir > 0 ? -r : W + r, y: H * .085, pts: pick([50, 100, 150, 300]) };
  }
  if (ufo) {
    ufo.x += ufo.dir * S() * .25 * dt;
    if (ufo.x < -ufo.r * 2 || ufo.x > W + ufo.r * 2) { ufo = null; ufoT = 18 + Math.random() * 10; }
  }

  for (const b of pBullets) {
    b.y -= S() * 1.3 * dt;
    if (b.y < -20 || hitBunker(b.x, b.y, 2)) { b.dead = true; continue; }
    for (const e of enemies) {
      if (!e.alive) continue;
      const [x, y] = epos(e);
      if (Math.abs(b.x - x) < form.er * 1.05 && Math.abs(b.y - y) < form.er * .9) { b.dead = true; killEnemy(e, x, y); break; }
    }
    if (!b.dead && ufo && Math.hypot(b.x - ufo.x, b.y - ufo.y) < ufo.r * 1.1) {
      b.dead = true; score += ufo.pts; burst(ufo.x, ufo.y, '#ff4d6d', 36);
      floats.push({ x: ufo.x, y: ufo.y + ufo.r, text: `¡Núcleo! +${ufo.pts}`, col: '#ff4d6d', life: 1.4, big: true });
      fact = { text: `Núcleo: ${TYPES.nucleo.fact}`, life: 3 };
      ufo = null; ufoT = 18 + Math.random() * 10; sfx('boom');
    }
    if (!b.dead) for (const q of eBullets)
      if (!q.dead && Math.hypot(b.x - q.x, b.y - q.y) < 10) { q.dead = b.dead = true; burst(b.x, b.y, '#ffd0d6', 6); break; }
  }
  pBullets = pBullets.filter(b => !b.dead);
  for (const q of eBullets) {
    if (q.dead) continue;
    q.y += q.vy * dt;
    if (q.y > H + 20 || hitBunker(q.x, q.y, 3)) { q.dead = true; continue; }
    if (invul <= 0 && Math.abs(q.x - player.x) < player.r * 1.35 && Math.abs(q.y - player.y) < player.r * 1.1) { q.dead = true; playerHit(); break; }
  }
  eBullets = eBullets.filter(q => !q.dead);
}

/* ================= Dibujo ================= */
function text(str, x, y, size, col, weight = 700, align = 'center') {
  ctx.font = `${weight} ${size}px Fredoka, system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * .12; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(str, x, y);
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
function drawAntibody(x, y, s, col) {
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, s * .28); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y + s * .6); ctx.lineTo(x, y);
  ctx.moveTo(x, y); ctx.lineTo(x - s * .5, y - s * .6); ctx.moveTo(x, y); ctx.lineTo(x + s * .5, y - s * .6); ctx.stroke();
}
function drawPlayer() {
  if (invul > 0 && Math.floor(invul * 10) % 2) return;
  const { x, y, r } = player;
  ctx.save(); ctx.shadowColor = '#7ff6ff'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#e8f0ff'; ctx.strokeStyle = '#7ff6ff'; ctx.lineWidth = 3;
  ell(x, y, r * 1.35, r * .9); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.fillStyle = '#6a4bc4'; ell(x, y + r * .1, r * .85, r * .6); ctx.fill();
  ctx.fillStyle = '#8f74e0'; circ(x - r * .3, y, r * .18); ctx.fill();
  ctx.save(); ctx.shadowColor = '#7ff6ff'; ctx.shadowBlur = 8; drawAntibody(x, y - r * 1.15, r * .55, '#7ff6ff'); ctx.restore();
}
function drawRadical(q, t) {
  ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(t * 8);
  ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 10; ctx.strokeStyle = '#ff6b81'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4; ctx.moveTo(Math.cos(a) * 7, Math.sin(a) * 7); ctx.lineTo(-Math.cos(a) * 7, -Math.sin(a) * 7); }
  ctx.stroke(); ctx.fillStyle = '#ffd0d6'; circ(0, 0, 3); ctx.fill(); ctx.restore();
}
function drawLifeIcon(x, y, r) {
  ctx.fillStyle = '#e8f0ff'; ell(x, y, r * 1.35, r * .9); ctx.fill();
  ctx.fillStyle = '#6a4bc4'; ell(x, y + r * .1, r * .85, r * .6); ctx.fill();
}

let lastMsg = null, lastOther = null;
function setMsg(s) { if (s !== lastMsg) { lastMsg = s; msgEl.textContent = s; msgEl.style.display = s ? 'block' : 'none'; } }

function render(now) {
  const t = now / 1000, u = S();
  ctx.save();
  if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  ctx.fillStyle = '#0b0f1a'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7);
  g.addColorStop(0, 'rgba(30,60,90,.35)'); g.addColorStop(1, 'rgba(5,8,18,.88)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (state !== 'menu') {
    for (const c of bunkers) if (c.alive) {
      ctx.fillStyle = c.j % 2 ? '#c9a24a' : '#f2d27a';
      ctx.fillRect(c.x - bunkerCS / 2, c.y - bunkerCS / 2, bunkerCS - 1, bunkerCS - 1);
    }
    for (const e of enemies) if (e.alive) {
      const [x, y] = epos(e);
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 3 + e.ph) * .25); TYPES[e.type].draw(form.er, t); ctx.restore();
    }
    if (ufo) { ctx.save(); ctx.translate(ufo.x, ufo.y); drawNucleus(ufo.r, t); ctx.restore(); }
    ctx.save(); ctx.shadowColor = '#7ff6ff'; ctx.shadowBlur = 8;
    for (const b of pBullets) drawAntibody(b.x, b.y, u * .018, '#bff9ff');
    ctx.restore();
    for (const q of eBullets) drawRadical(q, t);
    if (state === 'playing') drawPlayer();
  }
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.col; circ(p.x, p.y, p.r); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); text(f.text, f.x, f.y, u * (f.big ? .05 : .03), f.col); }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawCamPip();
  if (flash) { ctx.fillStyle = `rgba(255,40,70,${flash * .3})`; ctx.fillRect(0, 0, W, H); }

  if (state !== 'menu') {
    text(String(score), 24, 24 + u * .035, u * .07, '#fff', 700, 'left');
    text('Récord ' + best, 26, 24 + u * .09, u * .028, '#9fb3c8', 500, 'left');
    text(`Oleada ${wave}`, W / 2, 24 + u * .03, u * .035, '#7ff6ff', 500);
    if (state === 'playing') {
      for (let i = 0; i < lives; i++) drawLifeIcon(W - 36 - i * u * .07, 24 + u * .03, u * .018);
      if (autoFire) text('Disparo automático (A)', W - 24, 24 + u * .08, u * .022, '#ffd23f', 500, 'right');
    }
  }
  if (fact) {
    ctx.globalAlpha = Math.min(1, fact.life);
    ctx.font = `500 ${u * .028}px Fredoka, system-ui, sans-serif`;
    const w = ctx.measureText(fact.text).width + u * .06, y = u * .17;
    ctx.fillStyle = 'rgba(10,20,35,.75)'; ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, y - u * .028, w, u * .056, u * .028); ctx.fill();
    text(fact.text, W / 2, y, u * .028, '#e6f2ff', 500);
    ctx.globalAlpha = 1;
  }
  if (waveMsg) { ctx.globalAlpha = Math.min(1, waveMsg.life * 2); text(waveMsg.text, W / 2, H * .45, u * .07, '#ffd23f'); ctx.globalAlpha = 1; }

  if (state === 'menu') {
    text('ORGANELO', W / 2, H * .15, u * .11, '#fff');
    text('INVADERS', W / 2, H * .15 + u * .11, u * .11, '#7ff6ff');
    text('Eres un linfocito: muévete con ← → y dispara anticuerpos con ESPACIO (mantén para ráfaga)',
      W / 2, H * .15 + u * .2, u * .028, '#c9d6e3', 500);
    text('A: disparo automático · H: jugar con la mano (cámara)',
      W / 2, H * .15 + u * .245, u * .022, '#9fb3c8', 500);
    const legend = ['ribosoma', 'golgi', 'mitocondria', 'cloroplasto', 'lisosoma', 'vacuola', 'nucleo'];
    const gap = Math.min(W / 10, u * .16), y = H * .6;
    legend.forEach((k, i) => {
      const x = W / 2 + (i - 3) * gap;
      ctx.save(); ctx.translate(x, y + Math.sin(t * 3 + i) * 4); TYPES[k].draw(u * .03, t); ctx.restore();
      text(k === 'nucleo' ? '¿? pts' : `${TYPES[k].pts} pts`, x, y + u * .06, u * .022, k === 'nucleo' ? '#ff4d6d' : '#c9d6e3', 500);
    });
    if (Math.sin(t * 4) > -.3) text('PRESIONA ESPACIO PARA JUGAR', W / 2, H * .78, u * .04, '#fff');
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(5,8,18,.6)'; ctx.fillRect(0, 0, W, H);
    text('FIN DEL JUEGO', W / 2, H * .3, u * .09, '#ff4d6d');
    text(`${score} puntos · oleada ${wave}`, W / 2, H * .3 + u * .1, u * .05, '#fff');
    text(newBest ? '¡Nuevo récord!' : `Récord: ${best}`, W / 2, H * .3 + u * .17, u * .035, newBest ? '#ffd23f' : '#9fb3c8', 500);
    if (now - overAt > 1200 && Math.sin(t * 4) > -.3) text('PRESIONA ESPACIO PARA JUGAR DE NUEVO', W / 2, H * .66, u * .032, '#fff');
  }

  const showOther = state !== 'playing';
  if (showOther !== lastOther) { lastOther = showOther; otherEl.style.display = showOther ? 'block' : 'none'; }
  if (!handMode) setMsg(state === 'playing' ? '' : '⌨️ ← → mover · ESPACIO disparar');
  else if (camError) setMsg(camError);
  else if (!camReady) setMsg('Cargando cámara y detector de manos…');
  else if (!handsSeen) setMsg('Muestra tu mano a la cámara');
  else setMsg('👾 Mueve la mano a los lados · baja el pulgar para disparar');
}

/* ================= Entradas ================= */
cv.addEventListener('pointerdown', () => { if (state !== 'playing') fireInput(); });
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
  if (e.key === ' ' && !e.repeat && state !== 'playing') fireInput();
  else if (e.key === 'a' || e.key === 'A') autoFire = !autoFire;
  else if (e.key === 'c' || e.key === 'C') showPip = !showPip;
  else if ((e.key === 'h' || e.key === 'H') && !handMode) { handMode = true; initHands(); }
  ac();
});
addEventListener('keyup', e => { keys[e.key] = false; });

/* ================= Cámara + MediaPipe ================= */
let handMode = false; // la cámara solo se enciende si el jugador presiona H
let landmarker = null, camReady = false, handsSeen = 0, lastVT = -1, camError = '', lastHands = [], showPip = true;
const trig = { ratio: undefined, cocked: false };
const TRIG_UP = .5, TRIG_DOWN = .3;
const ZONE = { x0: .18, x1: .82, y0: .12, y1: .78 };
async function initHands() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
  } catch (e) {
    console.warn(e); camError = 'Sin acceso a la cámara: juega con mouse o teclado'; return;
  }
  try {
    const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const { HandLandmarker, FilesetResolver } = await import(V);
    const fs = await FilesetResolver.forVisionTasks(V + '/wasm');
    const opts = delegate => ({
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate },
      runningMode: 'VIDEO', numHands: 1,
    });
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch (e) { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
    camReady = true;
  } catch (e) {
    console.warn(e); camError = 'No se pudo cargar el detector de manos: juega con mouse o teclado';
  }
}
function detect(now) {
  if (!camReady || video.readyState < 2 || video.currentTime === lastVT) return;
  lastVT = video.currentTime;
  const res = landmarker.detectForVideo(video, now);
  lastHands = res.landmarks || [];
  handsSeen = lastHands.length;
  const lm = lastHands[0];
  if (!lm) { trig.ratio = undefined; return; }
  // posición: centro de la palma (más estable que la punta del dedo al disparar)
  const px = (lm[0].x + lm[5].x + lm[9].x + lm[17].x) / 4;
  player.tx = clamp(((1 - px) - ZONE.x0) / (ZONE.x1 - ZONE.x0), 0, 1) * W;
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y, lm[a].z - lm[b].z);
  trig.ratio = Math.min(d(4, 5), d(4, 6)) / (d(0, 9) || 1);
  if (trig.ratio > TRIG_UP) trig.cocked = true;
  else if (trig.ratio < TRIG_DOWN && trig.cocked) { trig.cocked = false; fireInput(); }
}
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawCamPip() {
  if (!showPip || !video.videoWidth || video.readyState < 2) return;
  const pw = Math.min(200, W * .18), ph = pw * video.videoHeight / video.videoWidth;
  const px = 16, py = H - ph - 56;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.clip();
  ctx.translate(px + pw, py); ctx.scale(-1, 1);
  ctx.globalAlpha = .75; ctx.drawImage(video, 0, 0, pw, ph); ctx.globalAlpha = 1;
  ctx.restore();
  ctx.save(); ctx.translate(px, py);
  ctx.strokeStyle = 'rgba(127,246,255,.7)'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
  ctx.strokeRect(ZONE.x0 * pw, ZONE.y0 * ph, (ZONE.x1 - ZONE.x0) * pw, (ZONE.y1 - ZONE.y0) * ph);
  ctx.setLineDash([]);
  for (const lm of lastHands) {
    const P = i => [(1 - lm[i].x) * pw, lm[i].y * ph];
    ctx.strokeStyle = '#7ff6ff'; ctx.lineWidth = 2;
    ctx.beginPath(); for (const [a, b] of BONES) { ctx.moveTo(...P(a)); ctx.lineTo(...P(b)); } ctx.stroke();
    ctx.fillStyle = '#ffd23f'; circ(...P(4), 4); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.stroke();
  if (trig.ratio !== undefined) {
    const by = py - 16, k = Math.min(1, trig.ratio / .8);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(px, by, pw, 6);
    ctx.fillStyle = trig.cocked ? '#7ff6ff' : '#ffd23f'; ctx.fillRect(px, by, pw * k, 6);
    ctx.fillStyle = '#ff4d6d'; ctx.fillRect(px + pw * TRIG_DOWN / .8 - 1, by - 2, 2, 10);
    ctx.fillStyle = '#46c261'; ctx.fillRect(px + pw * TRIG_UP / .8 - 1, by - 2, 2, 10);
    text(trig.cocked ? 'Pulgar arriba: listo' : 'Sube el pulgar para amartillar', px + pw / 2, by - 12, 12, '#c9d6e3', 500);
  }
  text('C: ocultar cámara', px + pw / 2, py + ph + 14, 12, '#9fb3c8', 500);
}

/* ================= Sonido ================= */
let AC = null;
function ac() { try { if (!AC) AC = new AudioContext(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function tone(type, f0, f1, dur, vol, t0 = 0) {
  const a = AC, t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function sfx(k) {
  const a = AC; if (!a || a.state !== 'running') return;
  if (k === 'pew') tone('square', 900, 220, .12, .06);
  else if (k === 'march') tone('square', [98, 92, 87, 82][marchI++ % 4], 70, .09, .07);
  else if (k === 'hit') tone('sawtooth', 220, 55, .5, .22);
  else if (k === 'wave') [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, .12, .12, i * .09));
  else if (k === 'boom') {
    const len = .25, buf = a.createBuffer(1, a.sampleRate * len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
    const g = a.createGain(); g.gain.value = .45;
    s.connect(f).connect(g).connect(a.destination); s.start();
  }
}

/* ================= Bucle ================= */
let prev = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - prev) / 1000); prev = now;
  if (!W || !H) { resize(); requestAnimationFrame(frame); return; }
  if (landmarker) { try { detect(now); } catch (e) { console.warn(e); } }
  update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
